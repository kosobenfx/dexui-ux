services:
  - type: web
    name: dexillionz-global-marketplace
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      # Supabase connection string. Add the real value in Render → Environment.
      - key: DATABASE_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: PROTECTION_FEE_RATE
        value: 0.015
      - key: DISPUTE_PERIOD_DAYS
        value: 3
      - key: PAYMENT_BENEFICIARY_NAME
        sync: false
      - key: PAYMENT_BANK_NAME
        sync: false
      - key: PAYMENT_ACCOUNT_NAME
        sync: false
      - key: PAYMENT_ACCOUNT_NUMBER
        sync: false
      - key: PAYMENT_ROUTING_CODE
        sync: false
      - key: PAYMENT_SWIFT
        sync: false
      - key: PAYMENT_IBAN
        sync: false
